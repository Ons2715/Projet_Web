spring.application.name=educar-backend
server.port=${PORT:4000}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auto_ecole}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

app.client-origin=${CLIENT_ORIGIN:*}
app.jwt.secret=${JWT_SECRET:EduCar_dev_secret_change_me_2026_secure_key_32_chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true